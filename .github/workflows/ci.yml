name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Verify tool registration
      run: |
        python -c "import asyncio; from instagram_mcp.server import server; tools = asyncio.run(server.list_tools()); assert len(tools) == 31, f'Expected 31 tools, got {len(tools)}'; print(f'Successfully verified {len(tools)} registered MCP tools!')"
